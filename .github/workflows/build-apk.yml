name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # позволяет запускать вручную с телефона

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Получить код
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Настроить Node.js + pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        run: npm install --global pnpm@10.34.5

      # 3. Capacitor 8 requires Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      # 4. Установить зависимости
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Собрать веб-приложение (base: './')
      - name: Build web app
        run: pnpm --filter @workspace/slime-survivors build:apk

      # 6. Добавить Android-платформу Capacitor
      - name: Capacitor add android
        working-directory: artifacts/slime-survivors
        run: pnpm exec cap add android

      # 7. Синхронизировать сборку с Android
      - name: Capacitor sync
        working-directory: artifacts/slime-survivors
        run: pnpm exec cap sync android

      # 8. Выдать права на Gradle wrapper
      - name: Make Gradle executable
        working-directory: artifacts/slime-survivors/android
        run: chmod +x gradlew

      # 9. Собрать debug APK
      - name: Build debug APK
        working-directory: artifacts/slime-survivors/android
        run: ./gradlew assembleDebug --no-daemon

      # 10. Загрузить APK как артефакт (скачать прямо с GitHub)
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: slime-survivors-debug
          path: artifacts/slime-survivors/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
